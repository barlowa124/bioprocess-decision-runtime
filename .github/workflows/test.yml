name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m compileall -q bioprocess_runtime tests
      - run: python -m unittest discover -s tests
      - run: python -m bioprocess_runtime suite
